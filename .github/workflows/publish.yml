name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Trusted publishing: npm accepts this workflow's OIDC identity instead of a stored token.
      # https://docs.npmjs.com/trusted-publishers
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
          node-version: 24
          package-manager-cache: false
      # Also builds lib/ through the prepare script; the publish step runs with --ignore-scripts.
      - run: npm ci
      # Publishes only when package.json has a version that is not on npm yet.
      - uses: JS-DevTools/npm-publish@v4
